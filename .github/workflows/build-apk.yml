```yaml
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK to separate branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git checkout --orphan apk-download
          git rm -rf .
          mkdir -p download
          cp /tmp/app-debug.apk download/SamanehMasjed.apk
          git add download/SamanehMasjed.apk
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish Android APK"
          git push origin apk-download --force
